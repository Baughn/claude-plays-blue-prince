# Headless sway for Blue Prince. Started by headless/start; watch via VNC on localhost:5900.
output HEADLESS-1 resolution 2560x1440 position 0 0
xwayland force
default_border none
default_floating_border none
focus_follows_mouse no
for_window [title=".*"] fullscreen enable
seat * hide_cursor 1000
exec_always sh -c 'echo "$WAYLAND_DISPLAY $DISPLAY" > /home/svein/dev/blueprince/headless/run/env'
exec /home/svein/dev/blueprince/headless/wayvnc/bin/wayvnc --max-fps=30 127.0.0.1 5900
